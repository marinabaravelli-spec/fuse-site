name: Tecnologia
order: 4
summary: Sites, landing pages, sistemas, integrações e experiências digitais desenvolvidos para organizar processos e melhorar a conversão.
pillarSummary: Desenvolvemos sites, landing pages, sistemas e integrações para organizar processos, melhorar experiências e apoiar conversões.
linkLabel: Conhecer Tecnologia
seo:
  title: Sites, Landing Pages e Sistemas para Empresas | Fuse
  description: Criamos sites, landing pages, sistemas e integrações conectados aos objetivos de marketing, conversão e operação da sua empresa.
title: Tecnologia para transformar processos em possibilidades.
intro:
- Tecnologia não deve existir apenas para parecer moderna. Ela precisa melhorar uma experiência, organizar um processo, reduzir atrito ou criar uma nova possibilidade para o negócio.
- A Fuse desenvolve experiências digitais e soluções sob medida conectadas à estratégia, ao marketing e à operação.
sections:
- discriminant: offerings
  value:
    heading: O que desenvolvemos
    items:
    - title: Sites institucionais
      text: Sites rápidos, responsivos e estruturados para apresentar a empresa, fortalecer autoridade e gerar oportunidades.
    - title: Landing pages
      text: Páginas orientadas à conversão, com mensagem, arquitetura, conteúdo, formulário e mensuração adequados à campanha.
    - title: Sistemas sob medida
      text: Soluções digitais para organizar dados, processos, rotinas, cadastros, jornadas ou operações específicas.
    - title: MVPs e protótipos
      text: Primeiras versões de produtos e experiências para validar uma ideia antes de ampliar o investimento.
    - title: Integrações
      text: Conexão entre ferramentas, formulários, CRM, e-mail, dados, automações e sistemas existentes.
    - title: Dashboards e organização de dados
      text: Estruturas para visualizar informações, acompanhar indicadores e apoiar decisões.
- discriminant: list
  value:
    heading: Como pensamos tecnologia
    intro: 'Antes de escolher a ferramenta, entendemos:'
    items:
    - Qual problema precisa ser resolvido
    - Quem utilizará a solução
    - Quais dados estão envolvidos
    - Quais processos já existem
    - Quais integrações são necessárias
    - Como a solução será mantida e evoluída
- discriminant: statement
  value:
    heading: Site bonito também precisa funcionar
    paragraphs:
    - Um site precisa ser visualmente bem construído, mas também rápido, acessível, rastreável, responsivo, fácil de atualizar e orientado à conversão.
ctaTitle: Existe um processo que poderia funcionar melhor?
ctaLabel: Conversar sobre tecnologia
faq:
- question: A Fuse cria sites do zero?
  answer: Sim. A Fuse pode atuar na estratégia, arquitetura, conteúdo, design, desenvolvimento, SEO, integrações e evolução de um site.
- question: A Fuse cria landing pages para campanhas?
  answer: Sim. As landing pages podem ser planejadas e desenvolvidas para campanhas, geração de leads, lançamentos ou conversões específicas.
- question: A Fuse desenvolve sistemas complexos?
  answer: A Fuse pode desenvolver protótipos, MVPs, sistemas e integrações conforme o escopo. A viabilidade, a tecnologia e o cronograma são definidos após compreender o problema e os requisitos.
- question: A tecnologia pode ser contratada separadamente do marketing?
  answer: Sim. A Fuse pode assumir uma frente específica. Ainda assim, recomenda-se conectar o projeto ao objetivo de negócio para evitar uma solução tecnicamente correta, mas pouco utilizada.
