seo:
  title: Contato | Agência de Marketing, Audiovisual e Tecnologia
  description: Converse com a Fuse sobre estratégia, marketing, audiovisual, tecnologia ou inteligência artificial. Atendimento nacional e presença no ABC Paulista.
title: Vamos entender o que sua empresa precisa construir agora.
intro:
- Conte sobre o momento do negócio, os objetivos e o principal desafio. A Fuse fará uma leitura inicial para identificar como estratégia, marketing, audiovisual, tecnologia ou inteligência artificial podem contribuir.
supportText: O primeiro contato não é uma apresentação de pacote pronto. É uma conversa para compreender o cenário, entender a prioridade e avaliar se existe aderência entre o desafio da empresa e a forma de atuação da Fuse.
challengePlaceholder: Conte brevemente o momento da empresa, o objetivo e o que já foi tentado.
howFoundOptions:
- Busca no Google
- Indicação
- LinkedIn
- Instagram
- Evento
- Outro
consentText: Li e concordo com a Política de Privacidade e autorizo o contato da Fuse sobre esta solicitação.
submitLabel: Solicitar diagnóstico
successTitle: Recebemos suas informações.
successMessage: Nossa equipe fará uma leitura inicial e entrará em contato para entender melhor o cenário. Obrigada por considerar a Fuse.
errorMessage: Não foi possível enviar sua solicitação. Revise os campos ou fale diretamente com a Fuse pelo WhatsApp.
whatsappTitle: Prefere conversar diretamente? Fale com a Fuse pelo WhatsApp.
whatsappMessage: Olá! Vim pelo site da Fuse e gostaria de conversar sobre um projeto. Minha empresa é [nome da empresa] e o principal desafio hoje é [desafio].
regionText: Atendimento em todo o Brasil, com presença no ABC Paulista e na Grande São Paulo.
closingLine: Pensamos estratégia. Entregamos resultado. Vamos conversar sobre o próximo movimento da sua empresa?
