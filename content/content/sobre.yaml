seo:
  title: Sobre a Fuse | Estratégia, Marketing e Tecnologia
  description: Conheça a Fuse, empresa que conecta estratégia, marketing, audiovisual, tecnologia e IA para construir operações de crescimento.
title: Estratégia para pensar. Execução para transformar.
intro:
- 'A Fuse existe para conectar as partes que muitas empresas precisam fazer funcionar juntas: estratégia, marketing, comunicação, audiovisual, tecnologia, vendas e inteligência artificial.'
- Não começamos pelo formato da entrega. Começamos pelo entendimento do negócio.
- Antes de propor uma campanha, um vídeo, uma landing page, um sistema ou uma automação, buscamos compreender o momento da empresa, o objetivo, o público, a jornada de compra e os gargalos que precisam ser enfrentados.
purpose:
  label: Por que a Fuse existe
  title: Crescimento não acontece por acaso. Ele é construído com direção e consistência.
  paragraphs:
  - Em muitas empresas, marketing, comunicação, vendas e tecnologia existem, mas não operam como um sistema.
  - Campanhas são lançadas sem uma proposta de valor clara. Conteúdos são publicados sem conexão com a jornada. Ferramentas são contratadas antes que os processos estejam organizados. Vídeos são produzidos sem uma função definida.
  - O resultado é uma operação ocupada, mas nem sempre capaz de explicar o que está funcionando, por que está funcionando e qual deve ser o próximo movimento.
  closing: A Fuse trabalha para reduzir essa distância entre intenção e execução.
thinking:
  label: Como pensamos
  title: A estratégia não termina no planejamento.
  paragraphs:
  - Para nós, uma boa estratégia precisa orientar escolhas, facilitar a execução e gerar aprendizado.
  - Por isso, conectamos pensamento e prática. Analisamos o contexto, definimos prioridades, desenvolvemos os ativos necessários, colocamos a operação em movimento e observamos os sinais para decidir melhor.
  principlesTitle: O que nos orienta
  principles:
  - Clareza antes de volume
  - Contexto antes de ferramenta
  - Estratégia antes de produção
  - Função antes de formato
  - Execução acompanhada de aprendizado
  - Tecnologia aplicada a problemas reais
  - Inteligência artificial com responsabilidade e revisão humana
presence:
  label: Onde atuamos
  title: Atendimento em todo o Brasil.
  text: A Fuse atende empresas em todo o Brasil e possui presença estratégica no ABC Paulista e na Grande São Paulo, incluindo Santo André, São Bernardo do Campo e São Caetano do Sul.
